<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzureVibe Prep | AZ-900 Exam Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-cyan-500 selection:text-slate-950 transition-colors duration-300" id="app-body">
    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-slate-900/90 dark:bg-slate-900/90 bg-white/90 backdrop-blur-xl border-r border-slate-800/80 dark:border-slate-800/80 border-slate-200 flex flex-col hidden md:flex z-20 transition-colors duration-300">
            <div class="p-6 flex items-center space-x-3 border-b border-slate-800/80 dark:border-slate-800/80 border-slate-200">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-cyan-500/25">
                    <i class="fa-solid fa-cloud"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">AzureVibe</h1>
                    <p class="text-xs text-slate-400 dark:text-slate-400 font-medium">AZ-900 Exam Hub</p>
                </div>
            </div>
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition-all bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 shadow-sm shadow-cyan-500/5">
                    <i class="fa-solid fa-chart-pie w-5"></i>
                    <span>Dashboard</span>
                </button>
                <button onclick="switchTab('flashcards')" id="nav-flashcards" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition-all text-slate-500 dark:text-slate-400 hover:bg-slate-800/60 dark:hover:bg-slate-800/60 hover:bg-slate-100 hover:text-slate-900 dark:hover:text-slate-200">
                    <i class="fa-solid fa-clone w-5"></i>
                    <span>Flashcard Coach</span>
                </button>
                <button onclick="switchTab('quiz')" id="nav-quiz" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition-all text-slate-500 dark:text-slate-400 hover:bg-slate-800/60 dark:hover:bg-slate-800/60 hover:bg-slate-100 hover:text-slate-900 dark:hover:text-slate-200">
                    <i class="fa-solid fa-list-check w-5"></i>
                    <span>Smart Quiz Builder</span>
                </button>
                <button onclick="switchTab('ai-buddy')" id="nav-ai-buddy" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition-all text-slate-500 dark:text-slate-400 hover:bg-slate-800/60 dark:hover:bg-slate-800/60 hover:bg-slate-100 hover:text-slate-900 dark:hover:text-slate-200">
                    <i class="fa-solid fa-robot w-5"></i>
                    <span>AI Study Buddy</span>
                </button>
            </nav>
            <div class="p-4 border-t border-slate-800/80 dark:border-slate-800/80 border-slate-200">
                <div class="bg-slate-800/40 dark:bg-slate-800/40 bg-slate-100 rounded-2xl p-4 border border-slate-700/40 dark:border-slate-700/40 border-slate-200">
                    <div class="flex items-center justify-between text-xs text-slate-400 dark:text-slate-400 mb-2 font-medium">
                        <span>Exam Countdown</span>
                        <span class="text-cyan-400 font-bold" id="countdown-days">14 Days
